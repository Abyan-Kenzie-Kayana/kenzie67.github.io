<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi To-Do List</title>
  
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      outline: none;
    }

    button#btnTambah {
      padding: 10px 15px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    button#btnTambah:hover {
      background-color: #218838;
    }

    ul {
      list-style: none;
    }

    li {
      background: #f9f9f9;
      padding: 10px 12px;
      margin-bottom: 8px;
      border-radius: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 4px solid #007bff;
      cursor: pointer;
    }

    /* Class saat tugas dicentang selesai */
    li.selesai span {
      text-decoration: line-through;
      color: #888;
    }

    .btn-hapus {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
    }

    .btn-hapus:hover {
      background-color: #c82333;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Daftar Tugas Saya</h2>
    
    <div class="input-group">
      <input type="text" id="inputTugas" placeholder="Tulis tugas baru di sini...">
      <button id="btnTambah">Tambah</button>
    </div>

    <ul id="daftarTugas"></ul>
  </div>

  <script>
    const inputTugas = document.getElementById('inputTugas');
    const btnTambah = document.getElementById('btnTambah');
    const daftarTugas = document.getElementById('daftarTugas');

    document.addEventListener('DOMContentLoaded', muatTugas);
    btnTambah.addEventListener('click', tambahTugas);

    inputTugas.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        tambahTugas();
      }
    });

    function tambahTugas() {
      const teksTugas = inputTugas.value.trim();

      if (teksTugas === '') {
        alert('Silakan tulis tugas terlebih dahulu!');
        return;
      }

      const tugasObj = {
        id: Date.now(),
        teks: teksTugas,
        selesai: false
      };

      buatElemenTugas(tugasObj);
      simpanKeStorage(tugasObj);

      inputTugas.value = '';
    }

    function buatElemenTugas(tugas) {
      const li = document.createElement('li');
      li.dataset.id = tugas.id;
      if (tugas.selesai) li.classList.add('selesai');

      li.innerHTML = `
        <span onclick="toggleSelesai(${tugas.id})">${tugas.teks}</span>
        <button class="btn-hapus" onclick="hapusTugas(${tugas.id})">Hapus</button>
      `;

      daftarTugas.appendChild(li);
    }

    function toggleSelesai(id) {
      const daftar = ambilDariStorage();
      const index = daftar.findIndex(t => t.id === id);

      if (index !== -1) {
        daftar[index].selesai = !daftar[index].selesai;
        localStorage.setItem('daftarTugas', JSON.stringify(daftar));
        
        const li = document.querySelector(`li[data-id="${id}"]`);
        li.classList.toggle('selesai');
      }
    }

    function hapusTugas(id) {
      let daftar = ambilDariStorage();
      daftar = daftar.filter(t => t.id !== id);
      localStorage.setItem('daftarTugas', JSON.stringify(daftar));

      const li = document.querySelector(`li[data-id="${id}"]`);
      li.remove();
    }

    function ambilDariStorage() {
      return localStorage.getItem('daftarTugas') 
        ? JSON.parse(localStorage.getItem('daftarTugas')) 
        : [];
    }

    function simpanKeStorage(tugas) {
      const daftar = ambilDariStorage();
      daftar.push(tugas);
      localStorage.setItem('daftarTugas', JSON.stringify(daftar));
    }

    function muatTugas() {
      const daftar = ambilDariStorage();
      daftar.forEach(tugas => buatElemenTugas(tugas));
    }
  </script>
</body>
</html>
