<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Kelurahan Wangon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar Customization */
        .navbar {
            background-color: #ffffff !important;
            padding: 15px 20px;
        }
        .navbar-brand {
            color: #27a770 !important; /* Warna hijau khas */
            font-weight: 700;
            font-size: 24px;
            text-decoration: none;
        }
        
        /* Tombol Toggler Menggunakan Gambar garis.png */
        .navbar-toggler {
            border: none;
            padding: 0;
            background: transparent;
        }
        .navbar-toggler:focus {
            box-shadow: none;
        }
        .icon-garis {
            width: 30px;
            height: auto;
            display: block;
        }

        /* Main Section dengan Background gapura.jpeg */
        .main-section {
            flex: 1;
            background: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), url('gapura.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: scroll;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        /* Judul Halaman */
        .section-title {
            color: #000000;
            font-weight: 700;
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-align: center;
            text-shadow: 1px 1px 3px rgba(255,255,255,0.5);
        }

        /* Kotak Putih Wadah Galeri */
        .gallery-card {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            max-width: 950px;
            width: 100%;
        }

        /* Bingkai & Pengaturan Gambar */
        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            margin-bottom: 24px; /* Jarak vertikal antar foto */
        }

        /* Efek sedikit membesar saat kursor diarahkan ke foto */
        .gallery-item:hover {
            transform: scale(1.03);
        }

        .gallery-img {
            width: 100%;
            height: 180px; /* Menyeragamkan tinggi potong aspek rasio foto */
            object-fit: cover; /* Agar gambar tidak gepeng */
            display: block;
        }

        /* Responsif untuk Layar HP */
        @media (max-width: 576px) {
            .section-title { font-size: 1.8rem; margin-bottom: 20px; }
            .main-section { padding: 25px 15px; }
            .gallery-card { padding: 20px 15px; }
            .gallery-img { height: 160px; } /* Sedikit disusutkan di HP */
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Kelurahan Wangon</a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <img src="garis.png" alt="Menu" class="icon-garis">
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto text-end">
                    <li class="nav-item">
                        <a class="nav-link text-dark" href="index.html">Beranda</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-dark" href="profil.html">Profil</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-dark" href="sejarah.html">Sejarah</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-dark" href="struktur.html">Struktur</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-dark" href="umkm.html">UMKM</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active fw-bold text-primary" href="galeri.html">Galeri</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-dark" href="kontak.html">Kontak</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="main-section">
        
        <h1 class="section-title">Galeri Wangon</h1>

        <div class="gallery-card container">
            <div class="row">
                
                <div class="col-md-4 col-sm-6 col-12">
                    <div class="gallery-item">
                        <img src="gapura.jpeg" alt="Gapura Kelurahan Wangon" class="gallery-img">
                    </div>
                </div>

                <div class="col-md-4 col-sm-6 col-12">
                    <div class="gallery-item">
                        <img src="lapangan.jpeg" alt="Lapangan Wangon" class="gallery-img">
                    </div>
                </div>

                <div class="col-md-4 col-sm-6 col-12">
                    <div class="gallery-item">
                        <img src="Kelurahan.jpeg" alt="Kantor Kelurahan Wangon" class="gallery-img">
                    </div>
                </div>

                <div class="col-md-4 col-sm-6 col-12">
                    <div class="gallery-item">
                        <img src="Mira.jpeg" alt="Mira Mart Wangon" class="gallery-img">
                    </div>
                </div>

                <div class="col-md-4 col-sm-6 col-12">
                    <div class="gallery-item">
                        <img src="esde.jpeg" alt="SD Negeri Wangon" class="gallery-img">
                    </div>
                </div>

                <div class="col-md-4 col-sm-6 col-12">
                    <div class="gallery-item">
                        <img src="masjid.jpeg" alt="Masjid Kelurahan Wangon" class="gallery-img">
                    </div>
                </div>

            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
